<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달무리 길드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif KR', serif;
  color: #e6f0ff;
  background: #050d18;
  overflow-x: hidden;
}

/* 배경 */
.bg-wrapper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  background: radial-gradient(ellipse at 50% 0%, #0b1e35 0%, #050d18 70%);
}

/* 별 */
.stars {
  position: absolute;
  width: 100%; height: 100%;
  background-image:
    radial-gradient(1px 1px at 10% 20%, white, transparent),
    radial-gradient(1px 1px at 25% 60%, white, transparent),
    radial-gradient(1px 1px at 40% 10%, white, transparent),
    radial-gradient(1px 1px at 55% 80%, white, transparent),
    radial-gradient(1px 1px at 70% 35%, white, transparent),
    radial-gradient(1px 1px at 85% 55%, white, transparent),
    radial-gradient(1px 1px at 15% 85%, white, transparent),
    radial-gradient(1px 1px at 90% 15%, white, transparent),
    radial-gradient(1.5px 1.5px at 30% 40%, rgba(255,255,200,0.9), transparent),
    radial-gradient(1.5px 1.5px at 60% 65%, rgba(255,255,200,0.9), transparent),
    radial-gradient(1.5px 1.5px at 75% 25%, rgba(255,255,200,0.9), transparent),
    radial-gradient(2px 2px at 45% 90%, rgba(200,220,255,0.8), transparent),
    radial-gradient(2px 2px at 5% 50%, rgba(200,220,255,0.8), transparent),
    radial-gradient(1px 1px at 95% 75%, white, transparent),
    radial-gradient(1px 1px at 20% 30%, white, transparent),
    radial-gradient(1px 1px at 65% 5%, white, transparent),
    radial-gradient(1px 1px at 35% 70%, white, transparent),
    radial-gradient(1px 1px at 80% 90%, white, transparent),
    radial-gradient(1px 1px at 50% 45%, white, transparent),
    radial-gradient(1px 1px at 12% 95%, rgba(255,255,255,0.6), transparent);
  opacity: 0.7;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle {
  from { opacity: 0.5; }
  to { opacity: 0.9; }
}

/* 달 */
.moon {
  position: absolute;
  top: 8%;
  right: 8%;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle at 40% 40%, #fffde0, #f0e8b0 50%, rgba(240,232,176,0.2) 75%);
  border-radius: 50%;
  box-shadow:
    0 0 30px rgba(255,250,180,0.5),
    0 0 80px rgba(255,250,180,0.2),
    0 0 150px rgba(255,250,180,0.1);
  animation: moonGlow 3s ease-in-out infinite alternate;
}
@keyframes moonGlow {
  from { box-shadow: 0 0 30px rgba(255,250,180,0.4), 0 0 80px rgba(255,250,180,0.15); }
  to { box-shadow: 0 0 40px rgba(255,250,180,0.6), 0 0 100px rgba(255,250,180,0.25); }
}

/* 불빛 */
.fire-glow {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(255,174,66,0.6) 0%, rgba(255,69,0,0.4) 40%, transparent 70%);
  filter: blur(30px);
  animation: fire 2s ease-in-out infinite alternate;
}
@keyframes fire {
  from { transform: translateX(-50%) scale(1); opacity: 0.6; }
  to { transform: translateX(-50%) scale(1.15); opacity: 0.9; }
}

/* 콘텐츠 */
.content {
  position: relative;
  z-index: 1;
}

/* 히어로 */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.hero-title {
  font-size: clamp(48px, 12vw, 80px);
  letter-spacing: 16px;
  font-weight: 700;
  text-shadow: 0 0 40px rgba(180,220,255,0.4);
  animation: fadeUp 1s ease both;
}

.hero-sub {
  margin-top: 16px;
  font-size: clamp(14px, 3vw, 18px);
  opacity: 0.6;
  letter-spacing: 4px;
  animation: fadeUp 1s 0.3s ease both;
}

.scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0.4;
  font-size: 12px;
  letter-spacing: 3px;
  animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 섹션 */
.section {
  padding: 60px 20px;
  text-align: center;
}

/* 카드 */
.card {
  max-width: 560px;
  margin: 0 auto;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 36px 28px;
  border-radius: 24px;
  backdrop-filter: blur(12px);
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.card.show {
  opacity: 1;
  transform: translateY(0);
}

.card h2 {
  font-size: 22px;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.card p {
  line-height: 2.2;
  opacity: 0.8;
  font-size: 15px;
}

/* 버튼 */
.btn {
  display: inline-block;
  margin-top: 24px;
  padding: 14px 32px;
  border-radius: 50px;
  background: linear-gradient(135deg, #1a3a6a, #2a5a9a);
  color: white;
  text-decoration: none;
  letter-spacing: 2px;
  font-size: 14px;
  font-family: 'Noto Serif KR', serif;
  border: 1px solid rgba(255,255,255,0.15);
  transition: 0.3s;
}
.btn:hover {
  background: linear-gradient(135deg, #2a5a9a, #3a7acc);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(50,120,200,0.3);
}

/* 구분선 */
.divider {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
  margin: 0 auto;
}

@media (max-width: 768px) {
  .moon { width: 70px; height: 70px; top: 5%; right: 5%; }
  .card { padding: 28px 20px; }
}
</style>
</head>
<body>

<div class="bg-wrapper">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="fire-glow"></div>
</div>

<div class="content">

  <section class="hero">
    <h1 class="hero-title">달무리</h1>
    <p class="hero-sub">달빛 아래, 함께하는 우리</p>
    <div class="scroll-hint">▼ scroll</div>
  </section>

  <div class="divider"></div>

  <section class="section">
    <div class="card">
      <h2>🌙 길드 소개</h2>
      <p>밤하늘 아래 모여 따뜻한 불을 피우듯,<br>함께 오래 즐기는 길드입니다.</p>
    </div>
  </section>

  <div class="divider"></div>

  <section class="section">
    <div class="card">
      <h2>🔥 모집 조건</h2>
      <p>✔ 매너 필수<br>✔ 꾸준한 플레이<br>✔ 디스코드 참여 가능</p>
    </div>
  </section>

  <div class="divider"></div>

  <section class="section">
    <div class="card">
      <h2>✨ 길드 규칙</h2>
      <p>✔ 서로 존중<br>✔ 과한 경쟁 ❌<br>✔ 즐겜 중심</p>
    </div>
  </section>

  <div class="divider"></div>

  <section class="section">
    <div class="card">
      <h2>🎮 가입 방법</h2>
      <p>디스코드로 문의해주세요</p>
      <a href="#" class="btn">디스코드 참여</a>
    </div>
  </section>

</div>

<script>
const cards = document.querySelectorAll('.card');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('show');
  });
}, { threshold: 0.15 });
cards.forEach(c => observer.observe(c));
</script>

</body>
</html>
